[project]
name = "drums"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["drumsctl/tests", "verify-server/tests", "metrics/tests", "report/tests", "envd-linux/tests", "compare/tests"]
pythonpath = ["drumsctl", "verify-server", "metrics", "report", "envd-linux", "compare"]

[tool.uv]
package = false
